<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 호흡곤란</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header">
  <div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div>
</header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>

<!-- 응급 배너 -->
<div class="vf-emergency-banner vf-mt-md">
  <span style="font-size:20px">⚠️</span>
  <span class="vf-emergency-banner__text">지금 많이 힘들어 보이면 문진 작성보다 즉시 내원을 먼저 해주세요.</span>
</div>

<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 5</div>
    <div class="vf-page-title__h1">😮‍💨 호흡곤란</div>
    <div class="vf-page-title__desc">호흡 이상에 대해 조금 더 알려주세요.</div>
  </div>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">언제부터인가요?</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="since" data-value="방금">방금</button>
          <button class="vf-chip" data-group="since" data-value="오늘">오늘</button>
          <button class="vf-chip" data-group="since" data-value="2~3일">2~3일</button>
          <button class="vf-chip" data-group="since" data-value="1주일 이상">1주일 이상</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">패턴</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="pattern" data-value="계속 힘들어 보임">계속 힘들어 보임</button>
          <button class="vf-chip" data-group="pattern" data-value="가끔">가끔</button>
          <button class="vf-chip" data-group="pattern" data-value="운동할 때만">운동할 때만</button>
          <button class="vf-chip" data-group="pattern" data-value="잘 때만">잘 때만</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">악화 요인</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="aggravating" data-value="운동/흥분 시">운동 / 흥분 시</button>
          <button class="vf-chip" data-group="aggravating" data-value="누울 때">누울 때</button>
          <button class="vf-chip" data-group="aggravating" data-value="특정 자세">특정 자세</button>
          <button class="vf-chip" data-group="aggravating" data-value="모름">모름</button>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">😮‍💨</span><span class="vf-section__title">호흡 양상 세부</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">어떻게 힘들어 보이나요? (여러 개 선택 가능)</label>
        <div class="vf-chips">
          <button class="vf-chip" data-multi="breathing_type" data-value="숨을 빨리 쉼">숨을 빨리 쉼</button>
          <button class="vf-chip" data-multi="breathing_type" data-value="배를 많이 씀">배를 많이 씀</button>
          <button class="vf-chip" data-multi="breathing_type" data-value="입을 벌리고 숨쉼">입을 벌리고 숨쉼</button>
          <button class="vf-chip" data-multi="breathing_type" data-value="목을 빼고 숨쉼">목을 빼고 숨쉼</button>
          <button class="vf-chip" data-multi="breathing_type" data-value="쌕쌕 소리 남">쌕쌕 소리 남</button>
          <button class="vf-chip" data-multi="breathing_type" data-value="그르렁 소리 남">그르렁 소리 남</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">입 벌리고 숨쉬나요?</label>
        <div class="vf-hint">고양이에서는 응급 신호입니다</div>
        <div class="vf-chips">
          <button class="vf-chip" data-group="open_mouth" data-value="없음">없음</button>
          <button class="vf-chip" data-group="open_mouth" data-value="가끔">가끔</button>
          <button class="vf-chip" data-group="open_mouth" data-value="자주">자주</button>
          <button class="vf-chip" data-group="open_mouth" data-value="거의 항상">거의 항상</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">혀 · 잇몸 색깔</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="gum_color" data-value="분홍(정상)">분홍 (정상)</button>
          <button class="vf-chip" data-group="gum_color" data-value="창백">창백</button>
          <button class="vf-chip" data-group="gum_color" data-value="파랗거나 보라색">파랗거나 보라색</button>
          <button class="vf-chip" data-group="gum_color" data-value="모름">모름</button>
        </div>
        <div class="vf-accordion" id="acc-cyanosis">
          <div class="vf-accordion__inner"><div id="urgent-cyanosis"></div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">기침 동반</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="cough" data-value="없음">없음</button>
          <button class="vf-chip" data-group="cough" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">기력 변화</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="energy" data-value="정상">정상</button>
          <button class="vf-chip" data-group="energy" data-value="처짐">처짐</button>
          <button class="vf-chip" data-group="energy" data-value="많이 처짐">많이 처짐</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">식욕 변화</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="appetite" data-value="정상">정상</button>
          <button class="vf-chip" data-group="appetite" data-value="감소">감소</button>
          <button class="vf-chip" data-group="appetite" data-value="안 먹음">안 먹음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">복부 팽만</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="abdomen" data-value="없음">없음</button>
          <button class="vf-chip" data-group="abdomen" data-value="있음">있음</button>
          <button class="vf-chip" data-group="abdomen" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 체중 변화</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="weight" data-value="비슷">비슷</button>
          <button class="vf-chip" data-group="weight" data-value="줄었음">줄었음</button>
          <button class="vf-chip" data-group="weight" data-value="늘었음">늘었음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">실신 · 쓰러짐 동반</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="syncope" data-value="없음">없음</button>
          <button class="vf-chip" data-group="syncope" data-value="있음">있음</button>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">지금 이 순간도 힘들어 보이나요?</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="current_status" data-value="조금 나아 보임">조금 나아 보임</button>
          <button class="vf-chip" data-group="current_status" data-value="비슷함">비슷함</button>
          <button class="vf-chip" data-group="current_status" data-value="점점 심해지는 것 같음">점점 심해지는 것 같음</button>
        </div>
        <div class="vf-accordion" id="acc-worsening">
          <div class="vf-accordion__inner"><div id="urgent-worsening"></div></div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 외상 가능성</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="trauma" data-value="없음">없음</button>
          <button class="vf-chip" data-group="trauma" data-value="있음">있음</button>
          <button class="vf-chip" data-group="trauma" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 이물 섭취 가능성</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="foreign_body" data-value="없음">없음</button>
          <button class="vf-chip" data-group="foreign_body" data-value="있음">있음</button>
          <button class="vf-chip" data-group="foreign_body" data-value="모름">모름</button>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="호흡곤란에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>

<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>

<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const multiState = { breathing_type: [] };

  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;

      if (group === 'cough'   && this.dataset.value === '있음') VF.Router.addBranchIfMissing('cough');
      if (group === 'syncope' && this.dataset.value === '있음') VF.Router.addBranchIfMissing('syncope');
      if (group === 'gum_color' && ['창백','파랗거나 보라색'].includes(this.dataset.value)) {
        VF.toggleAccordion(document.getElementById('acc-cyanosis'), true);
        VF.showUrgentAlert(document.getElementById('urgent-cyanosis'), '잇몸/혀 색깔 이상은 청색증·쇼크 징후입니다. 즉시 내원해주세요.');
      }
      if (group === 'current_status' && this.dataset.value === '점점 심해지는 것 같음') {
        VF.toggleAccordion(document.getElementById('acc-worsening'), true);
        VF.showUrgentAlert(document.getElementById('urgent-worsening'), '호흡곤란이 악화되고 있습니다. 지금 바로 내원해주세요.');
      }
    });
  });

  document.querySelectorAll('.vf-chip[data-multi]').forEach(chip => {
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      const key = this.dataset.multi;
      const val = this.dataset.value;
      if (this.classList.contains('selected')) { if (!multiState[key].includes(val)) multiState[key].push(val); }
      else { multiState[key] = multiState[key].filter(v => v !== val); }
    });
  });

  function handleNext() {
    VF.Storage.set('branch_dyspnea', {
      since: state.since, pattern: state.pattern, aggravating: state.aggravating,
      breathing_type: multiState.breathing_type, open_mouth: state.open_mouth, gum_color: state.gum_color,
      cough: state.cough, energy: state.energy, appetite: state.appetite,
      abdomen: state.abdomen, weight: state.weight, syncope: state.syncope,
      current_status: state.current_status, trauma: state.trauma, foreign_body: state.foreign_body,
      notes: document.getElementById('f-notes').value.trim(),
    });
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
