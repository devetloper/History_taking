<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 복부 팽만</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header"><div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div></header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>
<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 12</div>
    <div class="vf-page-title__h1">🫃 복부 팽만</div>
    <div class="vf-page-title__desc">복부 팽만에 대해 조금 더 알려주세요.</div>
  </div>
  <div class="vf-emergency-banner vf-mt-md">
    <span style="font-size:20px">⚠️</span>
    <span class="vf-emergency-banner__text">배가 갑자기 불러오고 토하려는데 안 나오거나 많이 힘들어 보이면 즉시 내원해주세요.</span>
  </div>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">언제부터인가요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="since" data-value="오늘">오늘</button>
          <button class="vf-chip" data-group="since" data-value="2~3일">2~3일</button>
          <button class="vf-chip" data-group="since" data-value="1주일">1주일</button>
          <button class="vf-chip" data-group="since" data-value="1달 이상">1달 이상</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">발생 속도</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="onset_speed" data-value="갑자기">갑자기</button>
          <button class="vf-chip" data-group="onset_speed" data-value="서서히">서서히</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">패턴</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="pattern" data-value="계속">계속</button>
          <button class="vf-chip" data-group="pattern" data-value="식후에 심해짐">식후에 심해짐</button>
          <button class="vf-chip" data-group="pattern" data-value="점점 심해짐">점점 심해짐</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🫃</span><span class="vf-section__title">복부 양상 세부</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">어느 부위가 불러 보이나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="location" data-value="전체적으로">전체적으로</button>
          <button class="vf-chip" data-group="location" data-value="앞쪽(명치 부근)">앞쪽(명치 부근)</button>
          <button class="vf-chip" data-group="location" data-value="뒤쪽(아랫배)">뒤쪽(아랫배)</button>
          <button class="vf-chip" data-group="location" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">배를 만지면 아파하나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="pain_touch" data-value="안 만져봤음">안 만져봤음</button>
          <button class="vf-chip" data-group="pain_touch" data-value="괜찮음">괜찮음</button>
          <button class="vf-chip" data-group="pain_touch" data-value="살짝 싫어함">살짝 싫어함</button>
          <button class="vf-chip" data-group="pain_touch" data-value="많이 아파함">많이 아파함</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">배를 두드렸을 때 소리가 나나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="percussion" data-value="안 해봤음">안 해봤음</button>
          <button class="vf-chip" data-group="percussion" data-value="둔탁한 소리">둔탁한 소리</button>
          <button class="vf-chip" data-group="percussion" data-value="북소리처럼 울림">북소리처럼 울림</button>
          <button class="vf-chip" data-group="percussion" data-value="모름">모름</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">구토 또는 구역질 시도</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="vomiting" data-value="없음">없음</button>
          <button class="vf-chip" data-group="vomiting" data-value="구역질만">구역질만</button>
          <button class="vf-chip" data-group="vomiting" data-value="구토 있음">구토 있음</button>
        </div>
        <div class="vf-accordion" id="acc-gdv">
          <div class="vf-accordion__inner"><div id="urgent-gdv"></div></div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">식욕 변화</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="appetite" data-value="정상">정상</button>
          <button class="vf-chip" data-group="appetite" data-value="감소">감소</button>
          <button class="vf-chip" data-group="appetite" data-value="안 먹음">안 먹음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">기력 변화</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="energy" data-value="정상">정상</button>
          <button class="vf-chip" data-group="energy" data-value="처짐">처짐</button>
          <button class="vf-chip" data-group="energy" data-value="많이 처짐">많이 처짐</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">호흡 변화</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="breathing" data-value="정상">정상</button>
          <button class="vf-chip" data-group="breathing" data-value="빨라 보임">빨라 보임</button>
          <button class="vf-chip" data-group="breathing" data-value="힘겨워 보임">힘겨워 보임</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">배뇨 이상</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="urinary" data-value="없음">없음</button>
          <button class="vf-chip" data-group="urinary" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">미중성화 암컷인데 최근 발정이 있었나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="pyometra_risk" data-value="해당 없음">해당 없음</button>
          <button class="vf-chip" data-group="pyometra_risk" data-value="아니요">아니요</button>
          <button class="vf-chip" data-group="pyometra_risk" data-value="있었음">있었음</button>
          <button class="vf-chip" data-group="pyometra_risk" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">체중이 줄었나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="weight_loss" data-value="모름">모름</button>
          <button class="vf-chip" data-group="weight_loss" data-value="비슷함">비슷함</button>
          <button class="vf-chip" data-group="weight_loss" data-value="줄어든 것 같음">줄어든 것 같음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">눈·잇몸·피부가 노랗게 보이나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="jaundice" data-value="없음">없음</button>
          <button class="vf-chip" data-group="jaundice" data-value="있는 것 같음">있는 것 같음</button>
          <button class="vf-chip" data-group="jaundice" data-value="모름">모름</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">갑자기 배가 불러오면서 토하려는데 안 나오나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="gdv_sign" data-value="없음">없음</button>
          <button class="vf-chip" data-group="gdv_sign" data-value="있음">있음</button>
        </div>
        <div class="vf-accordion" id="acc-gdv2">
          <div class="vf-accordion__inner"><div id="urgent-gdv2"></div></div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">잇몸 색깔</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="gum_color" data-value="분홍(정상)">분홍(정상)</button>
          <button class="vf-chip" data-group="gum_color" data-value="창백">창백</button>
          <button class="vf-chip" data-group="gum_color" data-value="흰색">흰색</button>
          <button class="vf-chip" data-group="gum_color" data-value="파랗거나 보라색">파랗거나 보라색</button>
          <button class="vf-chip" data-group="gum_color" data-value="모름">모름</button>
        </div>
        <div class="vf-accordion" id="acc-gum">
          <div class="vf-accordion__inner"><div id="urgent-gum"></div></div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 외상 가능성</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="trauma" data-value="없음">없음</button>
          <button class="vf-chip" data-group="trauma" data-value="있음">있음</button>
          <button class="vf-chip" data-group="trauma" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">이전에 심장병으로 진단받은 적 있나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="cardiac_hx" data-value="없음">없음</button>
          <button class="vf-chip" data-group="cardiac_hx" data-value="있음">있음</button>
          <button class="vf-chip" data-group="cardiac_hx" data-value="모름">모름</button>
        </div>
        <div class="vf-accordion" id="acc-cardiac">
          <div class="vf-accordion__inner">      <div class="vf-chips">
          <button class="vf-chip" data-group="cardiac_meds" data-value="현재 심장약 복용 중">현재 심장약 복용 중</button>
          <button class="vf-chip" data-group="cardiac_meds" data-value="복용 안 함">복용 안 함</button>
        </div></div>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="복부 팽만에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>
<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>
<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const multiState = {};
  const ACCORDION_RULES = {};

  Object.assign(ACCORDION_RULES, {
    cardiac_hx: { acc: 'acc-cardiac', trigger: '있음' },
  });
  function collectTextFields(data) {}
  function handleSideEffect(group, value) {
    if (group === 'urinary'  && value === '있음') VF.Router.addBranchIfMissing('urinary');
    if (group === 'vomiting' && value === '구역질만') {
      VF.toggleAccordion(document.getElementById('acc-gdv'), true);
      VF.showUrgentAlert(document.getElementById('urgent-gdv'), '복부 팽만 + 구역질만 반복되는 경우 위확장-염전(GDV) 가능성이 있습니다. 즉시 내원해주세요.');
    }
    if (group === 'gdv_sign' && value === '있음') {
      VF.toggleAccordion(document.getElementById('acc-gdv2'), true);
      VF.showUrgentAlert(document.getElementById('urgent-gdv2'), 'GDV(위확장-염전) 응급 징후입니다. 즉시 내원해주세요.');
    }
    if (group === 'gum_color' && ['창백','흰색','파랗거나 보라색'].includes(value)) {
      VF.toggleAccordion(document.getElementById('acc-gum'), true);
      VF.showUrgentAlert(document.getElementById('urgent-gum'), '잇몸 색깔 이상은 쇼크 징후입니다. 즉시 내원해주세요.');
    }
  }

  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;
      const rule = ACCORDION_RULES[group];
      if (rule) VF.toggleAccordion(document.getElementById(rule.acc), this.dataset.value === rule.trigger);
      handleSideEffect(group, this.dataset.value);
    });
  });
  document.querySelectorAll('.vf-chip[data-multi]').forEach(chip => {
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      const key = this.dataset.multi;
      const val = this.dataset.value;
      if (!multiState[key]) multiState[key] = [];
      if (this.classList.contains('selected')) { if (!multiState[key].includes(val)) multiState[key].push(val); }
      else { multiState[key] = multiState[key].filter(v => v !== val); }
    });
  });
  function handleNext() {
    const data = Object.assign({}, state);
    Object.keys(multiState).forEach(k => { data[k] = multiState[k]; });
    data.notes = document.getElementById('f-notes').value.trim();
    collectTextFields(data);
    VF.Storage.set('branch_abdomen', data);
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
