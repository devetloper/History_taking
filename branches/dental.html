<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 구강·치과 이상</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header"><div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div></header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>
<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 15</div>
    <div class="vf-page-title__h1">🦷 구강·치과 이상</div>
    <div class="vf-page-title__desc">구강 이상에 대해 조금 더 알려주세요.</div>
  </div>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">언제부터인가요?</label><div class="vf-chips"><button class="vf-chip" data-group="since" data-value="오늘">오늘</button> <button class="vf-chip" data-group="since" data-value="2~3일">2~3일</button> <button class="vf-chip" data-group="since" data-value="1주일">1주일</button> <button class="vf-chip" data-group="since" data-value="1달 이상">1달 이상</button> <button class="vf-chip" data-group="since" data-value="오래됨(수개월)">오래됨(수개월)</button></div></div><div class="vf-field"><label class="vf-label">패턴</label><div class="vf-chips"><button class="vf-chip" data-group="pattern" data-value="계속">계속</button> <button class="vf-chip" data-group="pattern" data-value="점점 심해짐">점점 심해짐</button> <button class="vf-chip" data-group="pattern" data-value="간헐적">간헐적</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🦷</span><span class="vf-section__title">구강 양상 세부</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">어떤 증상인가요? (여러 개 선택 가능)</label><div class="vf-chips"><button class="vf-chip" data-multi="symptoms" data-value="입 냄새가 심해짐">입 냄새가 심해짐</button> <button class="vf-chip" data-multi="symptoms" data-value="침을 많이 흘림">침을 많이 흘림</button> <button class="vf-chip" data-multi="symptoms" data-value="음식을 씹기 힘들어함">음식을 씹기 힘들어함</button> <button class="vf-chip" data-multi="symptoms" data-value="한쪽으로만 씹음">한쪽으로만 씹음</button> <button class="vf-chip" data-multi="symptoms" data-value="입 주변을 자꾸 긁거나 비빔">입 주변을 자꾸 긁거나 비빔</button> <button class="vf-chip" data-multi="symptoms" data-value="잇몸이 빨갛거나 붓는 것 같음">잇몸이 빨갛거나 붓는 것 같음</button> <button class="vf-chip" data-multi="symptoms" data-value="이가 흔들리거나 빠짐">이가 흔들리거나 빠짐</button> <button class="vf-chip" data-multi="symptoms" data-value="입에서 피가 남">입에서 피가 남</button></div></div><div class="vf-field"><label class="vf-label">구취가 언제부터 심해졌나요?</label><div class="vf-chips"><button class="vf-chip" data-group="halitosis_onset" data-value="원래 있었음">원래 있었음</button> <button class="vf-chip" data-group="halitosis_onset" data-value="최근 갑자기 심해짐">최근 갑자기 심해짐</button> <button class="vf-chip" data-group="halitosis_onset" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">침의 색깔이나 성상</label><div class="vf-chips"><button class="vf-chip" data-group="saliva" data-value="정상(투명)">정상(투명)</button> <button class="vf-chip" data-group="saliva" data-value="끈적하고 거품">끈적하고 거품</button> <button class="vf-chip" data-group="saliva" data-value="피 섞임">피 섞임</button> <button class="vf-chip" data-group="saliva" data-value="모름">모름</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">식욕 변화</label><div class="vf-chips"><button class="vf-chip" data-group="appetite" data-value="정상">정상</button> <button class="vf-chip" data-group="appetite" data-value="감소">감소</button> <button class="vf-chip" data-group="appetite" data-value="안 먹음">안 먹음</button></div></div><div class="vf-field"><label class="vf-label">밥을 먹으려다 멈추거나 뱉나요?</label><div class="vf-chips"><button class="vf-chip" data-group="stops_eating" data-value="없음">없음</button> <button class="vf-chip" data-group="stops_eating" data-value="있음">있음</button></div></div><div class="vf-field"><label class="vf-label">딱딱한 사료를 거부하나요?</label><div class="vf-chips"><button class="vf-chip" data-group="dry_food_refusal" data-value="원래 습식만 먹음">원래 습식만 먹음</button> <button class="vf-chip" data-group="dry_food_refusal" data-value="최근 거부하기 시작">최근 거부하기 시작</button> <button class="vf-chip" data-group="dry_food_refusal" data-value="해당 없음">해당 없음</button></div></div><div class="vf-field"><label class="vf-label">기력 변화</label><div class="vf-chips"><button class="vf-chip" data-group="energy" data-value="정상">정상</button> <button class="vf-chip" data-group="energy" data-value="처짐">처짐</button></div></div><div class="vf-field"><label class="vf-label">얼굴이 부어 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="face_swelling" data-value="없음">없음</button> <button class="vf-chip" data-group="face_swelling" data-value="있음">있음</button> <button class="vf-chip" data-group="face_swelling" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">코피나 코 분비물 동반</label><div class="vf-chips"><button class="vf-chip" data-group="nasal_discharge" data-value="없음">없음</button> <button class="vf-chip" data-group="nasal_discharge" data-value="있음">있음</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">입을 아예 못 열거나 턱을 못 움직이나요?</label><div class="vf-chips"><button class="vf-chip" data-group="trismus" data-value="없음">없음</button> <button class="vf-chip" data-group="trismus" data-value="있음">있음</button></div></div><div class="vf-field"><label class="vf-label">얼굴·턱 아래가 갑자기 부었나요?</label><div class="vf-chips"><button class="vf-chip" data-group="facial_swelling_acute" data-value="없음">없음</button> <button class="vf-chip" data-group="facial_swelling_acute" data-value="있음">있음</button></div><div class="vf-accordion" id="acc-abscess"><div class="vf-accordion__inner"><div id="urgent-abscess"></div></div></div></div><div class="vf-field"><label class="vf-label">고양이인데 입 안 전체가 헐어 보이나요?</label><div class="vf-chips"><button class="vf-chip" data-group="cat_stomatitis" data-value="해당 없음">해당 없음</button> <button class="vf-chip" data-group="cat_stomatitis" data-value="없음">없음</button> <button class="vf-chip" data-group="cat_stomatitis" data-value="있는 것 같음">있는 것 같음</button></div></div><div class="vf-field"><label class="vf-label">이전에 치과 처치·스케일링 받은 적 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="dental_hx" data-value="없음">없음</button> <button class="vf-chip" data-group="dental_hx" data-value="있음">있음</button> <button class="vf-chip" data-group="dental_hx" data-value="모름">모름</button></div><div class="vf-accordion" id="acc-dental-hx"><div class="vf-accordion__inner"><input class="vf-input" type="text" id="f-dental-date" placeholder="마지막 처치 시기가 언제였나요?" /></div></div></div><div class="vf-field"><label class="vf-label">신장·간 질환으로 진단받은 적 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="organ_disease" data-value="없음">없음</button> <button class="vf-chip" data-group="organ_disease" data-value="있음">있음</button> <button class="vf-chip" data-group="organ_disease" data-value="모름">모름</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="구강·치과 이상에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>
<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>
<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const multiState = {};
  const ACCORDION_RULES = {};

  Object.assign(ACCORDION_RULES, {
    dental_hx: { acc: 'acc-dental-hx', trigger: '있음' },
  });
  function collectTextFields(data) {
    data.dental_date = document.getElementById('f-dental-date') ? document.getElementById('f-dental-date').value.trim() : '';
  }
  function handleSideEffect(group, value) {
    if (group === 'appetite' && ['감소','안 먹음'].includes(value)) VF.Router.addBranchIfMissing('anorexia');
    if (group === 'facial_swelling_acute' && value === '있음') {
      VF.toggleAccordion(document.getElementById('acc-abscess'), true);
      VF.showUrgentAlert(document.getElementById('urgent-abscess'), '얼굴·턱 아래 갑작스러운 부종은 치근 농양·봉소염 가능성입니다. 빠른 내원을 권장합니다.');
    }
  }

  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;
      const rule = ACCORDION_RULES[group];
      if (rule) VF.toggleAccordion(document.getElementById(rule.acc), this.dataset.value === rule.trigger);
      handleSideEffect(group, this.dataset.value);
    });
  });
  document.querySelectorAll('.vf-chip[data-multi]').forEach(chip => {
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      const key = this.dataset.multi;
      const val = this.dataset.value;
      if (!multiState[key]) multiState[key] = [];
      if (this.classList.contains('selected')) { if (!multiState[key].includes(val)) multiState[key].push(val); }
      else { multiState[key] = multiState[key].filter(v => v !== val); }
    });
  });
  function handleNext() {
    const data = Object.assign({}, state);
    Object.keys(multiState).forEach(k => { data[k] = multiState[k]; });
    data.notes = document.getElementById('f-notes').value.trim();
    collectTextFields(data);
    VF.Storage.set('branch_dental', data);
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
