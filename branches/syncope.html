<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 기절</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header"><div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div></header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>
<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 14</div>
    <div class="vf-page-title__h1">😵 기절</div>
    <div class="vf-page-title__desc">기절에 대해 조금 더 알려주세요.</div>
  </div>
  <div class="vf-emergency-banner vf-mt-md">
    <span style="font-size:20px">⚠️</span>
    <span class="vf-emergency-banner__text">기절 후 회복이 느리거나 반복된다면 즉시 내원해주세요.</span>
  </div>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">언제 발생했나요?</label><div class="vf-chips"><button class="vf-chip" data-group="when" data-value="지금 막">지금 막</button> <button class="vf-chip" data-group="when" data-value="오늘">오늘</button> <button class="vf-chip" data-group="when" data-value="2~3일 내">2~3일 내</button> <button class="vf-chip" data-group="when" data-value="1주일 이상 전">1주일 이상 전</button></div></div><div class="vf-field"><label class="vf-label">횟수</label><div class="vf-chips"><button class="vf-chip" data-group="count" data-value="처음">처음</button> <button class="vf-chip" data-group="count" data-value="2~3회">2~3회</button> <button class="vf-chip" data-group="count" data-value="자주 반복됨">자주 반복됨</button></div></div><div class="vf-field"><label class="vf-label">언제 발생했나요?</label><div class="vf-chips"><button class="vf-chip" data-group="trigger" data-value="운동·흥분 중">운동·흥분 중</button> <button class="vf-chip" data-group="trigger" data-value="쉬는 중">쉬는 중</button> <button class="vf-chip" data-group="trigger" data-value="자다가">자다가</button> <button class="vf-chip" data-group="trigger" data-value="모름">모름</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">😵</span><span class="vf-section__title">기절 양상 세부</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">쓰러질 때 어떤 모습이었나요? (여러 개 선택 가능)</label><div class="vf-chips"><button class="vf-chip" data-multi="collapse_type" data-value="갑자기 푹 쓰러짐">갑자기 푹 쓰러짐</button> <button class="vf-chip" data-multi="collapse_type" data-value="비틀거리다 쓰러짐">비틀거리다 쓰러짐</button> <button class="vf-chip" data-multi="collapse_type" data-value="온몸이 뻣뻣해짐">온몸이 뻣뻣해짐</button> <button class="vf-chip" data-multi="collapse_type" data-value="몸을 떨었음">몸을 떨었음</button> <button class="vf-chip" data-multi="collapse_type" data-value="의식이 없어 보였음">의식이 없어 보였음</button></div></div><div class="vf-field"><label class="vf-label">쓰러져 있던 시간</label><div class="vf-chips"><button class="vf-chip" data-group="duration" data-value="수초 이내">수초 이내</button> <button class="vf-chip" data-group="duration" data-value="1분 이내">1분 이내</button> <button class="vf-chip" data-group="duration" data-value="수분 이상">수분 이상</button> <button class="vf-chip" data-group="duration" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">쓰러지기 전 이상한 행동이 있었나요?</label><div class="vf-chips"><button class="vf-chip" data-group="pre_signs" data-value="없음">없음</button> <button class="vf-chip" data-group="pre_signs" data-value="비틀거림">비틀거림</button> <button class="vf-chip" data-group="pre_signs" data-value="멍해 보임">멍해 보임</button> <button class="vf-chip" data-group="pre_signs" data-value="헐떡임">헐떡임</button> <button class="vf-chip" data-group="pre_signs" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">쓰러진 후 얼마나 빨리 회복됐나요?</label><div class="vf-chips"><button class="vf-chip" data-group="recovery" data-value="바로 멀쩡해짐">바로 멀쩡해짐</button> <button class="vf-chip" data-group="recovery" data-value="수분 내 회복">수분 내 회복</button> <button class="vf-chip" data-group="recovery" data-value="한동안 처져있음">한동안 처져있음</button> <button class="vf-chip" data-group="recovery" data-value="아직 이상함">아직 이상함</button></div></div><div class="vf-field"><label class="vf-label">회복 후 멍하거나 비틀거렸나요?</label><div class="vf-chips"><button class="vf-chip" data-group="post_signs" data-value="없음">없음</button> <button class="vf-chip" data-group="post_signs" data-value="잠깐">잠깐</button> <button class="vf-chip" data-group="post_signs" data-value="오래 지속됨">오래 지속됨</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">기절 중 대소변을 지렸나요?</label><div class="vf-chips"><button class="vf-chip" data-group="incontinence" data-value="없음">없음</button> <button class="vf-chip" data-group="incontinence" data-value="있음">있음</button> <button class="vf-chip" data-group="incontinence" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">기절 전후로 기침이 있었나요?</label><div class="vf-chips"><button class="vf-chip" data-group="cough" data-value="없음">없음</button> <button class="vf-chip" data-group="cough" data-value="있음">있음</button></div></div><div class="vf-field"><label class="vf-label">호흡 이상 동반</label><div class="vf-chips"><button class="vf-chip" data-group="dyspnea" data-value="없음">없음</button> <button class="vf-chip" data-group="dyspnea" data-value="있음">있음</button></div></div><div class="vf-field"><label class="vf-label">운동 불내성</label><div class="vf-chips"><button class="vf-chip" data-group="exercise_intolerance" data-value="없음">없음</button> <button class="vf-chip" data-group="exercise_intolerance" data-value="조금만 움직여도 힘들어 보임">조금만 움직여도 힘들어 보임</button></div></div><div class="vf-field"><label class="vf-label">평소 기력·식욕</label><div class="vf-chips"><button class="vf-chip" data-group="baseline" data-value="정상">정상</button> <button class="vf-chip" data-group="baseline" data-value="최근 처짐">최근 처짐</button> <button class="vf-chip" data-group="baseline" data-value="많이 처짐">많이 처짐</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">지금도 의식이 없거나 이상한가요?</label><div class="vf-chips"><button class="vf-chip" data-group="current_status" data-value="정상으로 돌아옴">정상으로 돌아옴</button> <button class="vf-chip" data-group="current_status" data-value="아직 이상함">아직 이상함</button></div><div class="vf-accordion" id="acc-current"><div class="vf-accordion__inner"><div id="urgent-current"></div></div></div></div><div class="vf-field"><label class="vf-label">잇몸 색깔</label><div class="vf-chips"><button class="vf-chip" data-group="gum_color" data-value="분홍(정상)">분홍(정상)</button> <button class="vf-chip" data-group="gum_color" data-value="창백">창백</button> <button class="vf-chip" data-group="gum_color" data-value="흰색">흰색</button> <button class="vf-chip" data-group="gum_color" data-value="파랗거나 보라색">파랗거나 보라색</button> <button class="vf-chip" data-group="gum_color" data-value="모름">모름</button></div><div class="vf-accordion" id="acc-gum"><div class="vf-accordion__inner"><div id="urgent-gum"></div></div></div></div><div class="vf-field"><label class="vf-label">이전에 심장병으로 진단받은 적 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="cardiac_hx" data-value="없음">없음</button> <button class="vf-chip" data-group="cardiac_hx" data-value="있음">있음</button> <button class="vf-chip" data-group="cardiac_hx" data-value="모름">모름</button></div><div class="vf-accordion" id="acc-cardiac"><div class="vf-accordion__inner"><div class="vf-chips"><button class="vf-chip" data-group="cardiac_meds" data-value="현재 심장약 복용 중">현재 심장약 복용 중</button> <button class="vf-chip" data-group="cardiac_meds" data-value="복용 안 함">복용 안 함</button></div></div></div></div><div class="vf-field"><label class="vf-label">최근 독성물질·약물 노출 가능성</label><div class="vf-chips"><button class="vf-chip" data-group="toxin" data-value="없음">없음</button> <button class="vf-chip" data-group="toxin" data-value="있음">있음</button> <button class="vf-chip" data-group="toxin" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">최근 외상 가능성</label><div class="vf-chips"><button class="vf-chip" data-group="trauma" data-value="없음">없음</button> <button class="vf-chip" data-group="trauma" data-value="있음">있음</button> <button class="vf-chip" data-group="trauma" data-value="모름">모름</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="기절에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>
<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>
<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const multiState = {};
  const ACCORDION_RULES = {};

  Object.assign(ACCORDION_RULES, {
    cardiac_hx: { acc: 'acc-cardiac', trigger: '있음' },
  });
  function collectTextFields(data) {}
  function handleSideEffect(group, value) {
    if (group === 'dyspnea' && value === '있음') VF.Router.addBranchIfMissing('dyspnea');
    if (group === 'current_status' && value === '아직 이상함') {
      VF.toggleAccordion(document.getElementById('acc-current'), true);
      VF.showUrgentAlert(document.getElementById('urgent-current'), '의식이 아직 이상합니다. 즉시 내원해주세요.');
    }
    if (group === 'gum_color' && ['창백','흰색','파랗거나 보라색'].includes(value)) {
      VF.toggleAccordion(document.getElementById('acc-gum'), true);
      VF.showUrgentAlert(document.getElementById('urgent-gum'), '잇몸 색깔 이상은 쇼크·저산소증 징후입니다. 즉시 내원해주세요.');
    }
  }

  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;
      const rule = ACCORDION_RULES[group];
      if (rule) VF.toggleAccordion(document.getElementById(rule.acc), this.dataset.value === rule.trigger);
      handleSideEffect(group, this.dataset.value);
    });
  });
  document.querySelectorAll('.vf-chip[data-multi]').forEach(chip => {
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      const key = this.dataset.multi;
      const val = this.dataset.value;
      if (!multiState[key]) multiState[key] = [];
      if (this.classList.contains('selected')) { if (!multiState[key].includes(val)) multiState[key].push(val); }
      else { multiState[key] = multiState[key].filter(v => v !== val); }
    });
  });
  function handleNext() {
    const data = Object.assign({}, state);
    Object.keys(multiState).forEach(k => { data[k] = multiState[k]; });
    data.notes = document.getElementById('f-notes').value.trim();
    collectTextFields(data);
    VF.Storage.set('branch_syncope', data);
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
