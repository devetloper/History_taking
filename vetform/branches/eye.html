<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 눈 이상</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header"><div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div></header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>
<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 11</div>
    <div class="vf-page-title__h1">👁️ 눈 이상</div>
    <div class="vf-page-title__desc">눈 이상에 대해 조금 더 알려주세요.</div>
  </div>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">언제부터인가요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="since" data-value="오늘">오늘</button>
          <button class="vf-chip" data-group="since" data-value="2~3일">2~3일</button>
          <button class="vf-chip" data-group="since" data-value="1주일">1주일</button>
          <button class="vf-chip" data-group="since" data-value="1달 이상">1달 이상</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">패턴</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="pattern" data-value="계속">계속</button>
          <button class="vf-chip" data-group="pattern" data-value="간헐적">간헐적</button>
          <button class="vf-chip" data-group="pattern" data-value="점점 심해짐">점점 심해짐</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">어느 쪽 눈인가요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="side" data-value="왼쪽">왼쪽</button>
          <button class="vf-chip" data-group="side" data-value="오른쪽">오른쪽</button>
          <button class="vf-chip" data-group="side" data-value="양쪽">양쪽</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">👁️</span><span class="vf-section__title">눈 양상 세부</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">어떤 증상인가요? (여러 개 선택 가능)</label>
              <div class="vf-chips">
          <button class="vf-chip" data-multi="symptoms" data-value="눈을 못 뜸·찡그림">눈을 못 뜸·찡그림</button>
          <button class="vf-chip" data-multi="symptoms" data-value="눈물·분비물 많음">눈물·분비물 많음</button>
          <button class="vf-chip" data-multi="symptoms" data-value="눈이 빨개짐">눈이 빨개짐</button>
          <button class="vf-chip" data-multi="symptoms" data-value="눈이 흐리거나 뿌옇게 보임">눈이 흐리거나 뿌옇게 보임</button>
          <button class="vf-chip" data-multi="symptoms" data-value="눈이 튀어나온 것 같음">눈이 튀어나온 것 같음</button>
          <button class="vf-chip" data-multi="symptoms" data-value="눈이 작아진 것 같음">눈이 작아진 것 같음</button>
          <button class="vf-chip" data-multi="symptoms" data-value="자꾸 긁거나 비빔">자꾸 긁거나 비빔</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">분비물 색깔</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="discharge_color" data-value="없음">없음</button>
          <button class="vf-chip" data-group="discharge_color" data-value="투명">투명</button>
          <button class="vf-chip" data-group="discharge_color" data-value="흰색·노란색">흰색·노란색</button>
          <button class="vf-chip" data-group="discharge_color" data-value="녹색">녹색</button>
          <button class="vf-chip" data-group="discharge_color" data-value="갈색·검은색">갈색·검은색</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">눈이 뿌옇거나 흰색으로 보이나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="opacity" data-value="없음">없음</button>
          <button class="vf-chip" data-group="opacity" data-value="있음">있음</button>
          <button class="vf-chip" data-group="opacity" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">눈 크기가 달라 보이나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="size_diff" data-value="없음">없음</button>
          <button class="vf-chip" data-group="size_diff" data-value="한쪽이 더 커 보임">한쪽이 더 커 보임</button>
          <button class="vf-chip" data-group="size_diff" data-value="한쪽이 더 작아 보임">한쪽이 더 작아 보임</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">빛을 피하거나 눈부셔 하나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="photophobia" data-value="없음">없음</button>
          <button class="vf-chip" data-group="photophobia" data-value="있음">있음</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">콧물·재채기 동반</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="nasal" data-value="없음">없음</button>
          <button class="vf-chip" data-group="nasal" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">식욕·기력 변화</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="general" data-value="정상">정상</button>
          <button class="vf-chip" data-group="general" data-value="감소">감소</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">머리나 얼굴을 자주 긁나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="face_scratching" data-value="없음">없음</button>
          <button class="vf-chip" data-group="face_scratching" data-value="있음">있음</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">눈이 튀어나와 보이나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="proptosis" data-value="없음">없음</button>
          <button class="vf-chip" data-group="proptosis" data-value="있는 것 같음">있는 것 같음</button>
        </div>
        <div class="vf-accordion" id="acc-proptosis">
          <div class="vf-accordion__inner"><div id="urgent-proptosis"></div></div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">눈에 상처나 이물질이 보이나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="cornea_injury" data-value="없음">없음</button>
          <button class="vf-chip" data-group="cornea_injury" data-value="있음">있음</button>
          <button class="vf-chip" data-group="cornea_injury" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">외상 가능성</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="trauma" data-value="없음">없음</button>
          <button class="vf-chip" data-group="trauma" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">이전에 눈 관련 진단·치료받은 적 있나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="eye_hx" data-value="없음">없음</button>
          <button class="vf-chip" data-group="eye_hx" data-value="있음">있음</button>
          <button class="vf-chip" data-group="eye_hx" data-value="모름">모름</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="눈 이상에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>
<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>
<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const multiState = {};
  const ACCORDION_RULES = {};

  function collectTextFields(data) {}
  function handleSideEffect(group, value) {
    if (group === 'nasal' && value === '있음') VF.Router.addBranchIfMissing('nasal');
    if (group === 'proptosis' && value === '있는 것 같음') {
      VF.toggleAccordion(document.getElementById('acc-proptosis'), true);
      VF.showUrgentAlert(document.getElementById('urgent-proptosis'), '눈이 튀어나온 것은 녹내장 또는 안구탈출 응급입니다. 즉시 내원해주세요.');
    }
  }

  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;
      const rule = ACCORDION_RULES[group];
      if (rule) VF.toggleAccordion(document.getElementById(rule.acc), this.dataset.value === rule.trigger);
      handleSideEffect(group, this.dataset.value);
    });
  });
  document.querySelectorAll('.vf-chip[data-multi]').forEach(chip => {
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      const key = this.dataset.multi;
      const val = this.dataset.value;
      if (!multiState[key]) multiState[key] = [];
      if (this.classList.contains('selected')) { if (!multiState[key].includes(val)) multiState[key].push(val); }
      else { multiState[key] = multiState[key].filter(v => v !== val); }
    });
  });
  function handleNext() {
    const data = Object.assign({}, state);
    Object.keys(multiState).forEach(k => { data[k] = multiState[k]; });
    data.notes = document.getElementById('f-notes').value.trim();
    collectTextFields(data);
    VF.Storage.set('branch_eye', data);
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
