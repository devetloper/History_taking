<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 식욕부진</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header">
  <div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div>
</header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>
<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 3</div>
    <div class="vf-page-title__h1">🍽️ 식욕부진</div>
    <div class="vf-page-title__desc">식욕 저하에 대해 조금 더 알려주세요.</div>
  </div>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">언제부터인가요?</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="since" data-value="오늘">오늘</button>
          <button class="vf-chip" data-group="since" data-value="2~3일">2~3일</button>
          <button class="vf-chip" data-group="since" data-value="1주일">1주일</button>
          <button class="vf-chip" data-group="since" data-value="1달 이상">1달 이상</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">어느 정도 안 먹나요?</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="degree" data-value="평소보다 줄었음">평소보다 줄었음</button>
          <button class="vf-chip" data-group="degree" data-value="절반 이하">절반 이하</button>
          <button class="vf-chip" data-group="degree" data-value="거의 안 먹음">거의 안 먹음</button>
          <button class="vf-chip" data-group="degree" data-value="완전히 안 먹음">완전히 안 먹음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">패턴</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="pattern" data-value="계속 안 먹음">계속 안 먹음</button>
          <button class="vf-chip" data-group="pattern" data-value="먹다 안 먹다 반복">먹다 안 먹다 반복</button>
          <button class="vf-chip" data-group="pattern" data-value="점점 줄어드는 중">점점 줄어드는 중</button>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🍖</span><span class="vf-section__title">식이 행동 세부</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">사료는 안 먹지만 간식은 먹나요?</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="treats_ok" data-value="간식도 안 먹음">간식도 안 먹음</button>
          <button class="vf-chip" data-group="treats_ok" data-value="간식은 먹음">간식은 먹음</button>
          <button class="vf-chip" data-group="treats_ok" data-value="시도 안 해봄">시도 안 해봄</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">음식 앞에서의 행동</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="food_behavior" data-value="아예 관심 없음">아예 관심 없음</button>
          <button class="vf-chip" data-group="food_behavior" data-value="냄새만 맡고 돌아섬">냄새만 맡고 돌아섬</button>
          <button class="vf-chip" data-group="food_behavior" data-value="먹으려다 멈춤">먹으려다 멈춤</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">물은 마시나요?</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="water" data-value="정상">정상</button>
          <button class="vf-chip" data-group="water" data-value="증가">증가</button>
          <button class="vf-chip" data-group="water" data-value="감소">감소</button>
          <button class="vf-chip" data-group="water" data-value="안 마심">안 마심</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 식이 변경</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="diet_change" data-value="없음">없음</button>
          <button class="vf-chip" data-group="diet_change" data-value="있음">있음</button>
        </div>
        <div class="vf-accordion" id="acc-diet">
          <div class="vf-accordion__inner">
            <input class="vf-input" type="text" id="f-diet-detail" placeholder="어떤 음식으로 바꿨나요?" />
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">구토 동반</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="vomiting" data-value="없음">없음</button>
          <button class="vf-chip" data-group="vomiting" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">설사 동반</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="diarrhea" data-value="없음">없음</button>
          <button class="vf-chip" data-group="diarrhea" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">기력 변화</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="energy" data-value="정상">정상</button>
          <button class="vf-chip" data-group="energy" data-value="약간 처짐">약간 처짐</button>
          <button class="vf-chip" data-group="energy" data-value="많이 처짐">많이 처짐</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">체중 변화</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="weight" data-value="모름">모름</button>
          <button class="vf-chip" data-group="weight" data-value="빠진 것 같음">빠진 것 같음</button>
          <button class="vf-chip" data-group="weight" data-value="비슷함">비슷함</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">구강 이상 (침 흘림, 입 주변 긁음)</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="oral" data-value="없음">없음</button>
          <button class="vf-chip" data-group="oral" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">복부 팽만</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="abdomen" data-value="없음">없음</button>
          <button class="vf-chip" data-group="abdomen" data-value="있음">있음</button>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">이물 섭취 가능성</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="foreign_body" data-value="없음">없음</button>
          <button class="vf-chip" data-group="foreign_body" data-value="있음">있음</button>
          <button class="vf-chip" data-group="foreign_body" data-value="모름">모름</button>
        </div>
        <div class="vf-accordion" id="acc-foreign">
          <div class="vf-accordion__inner">
            <input class="vf-input" type="text" id="f-foreign-detail" placeholder="무엇을 먹었나요?" />
          </div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">황달 (눈 / 잇몸 / 피부가 노래 보임)</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="jaundice" data-value="없음">없음</button>
          <button class="vf-chip" data-group="jaundice" data-value="있음">있음</button>
          <button class="vf-chip" data-group="jaundice" data-value="모름">모름</button>
        </div>
        <div class="vf-accordion" id="acc-jaundice">
          <div class="vf-accordion__inner">
            <div id="urgent-jaundice"></div>
          </div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 약물 투여 시작</label>
        <div class="vf-chips">
          <button class="vf-chip" data-group="new_drug" data-value="없음">없음</button>
          <button class="vf-chip" data-group="new_drug" data-value="있음">있음</button>
        </div>
        <div class="vf-accordion" id="acc-drug">
          <div class="vf-accordion__inner">
            <input class="vf-input" type="text" id="f-drug-detail" placeholder="약물 이름이 무엇인가요?" />
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="식욕부진에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>

<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>

<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const ACCORDION_RULES = {
    diet_change:  { acc: 'acc-diet',     trigger: '있음' },
    foreign_body: { acc: 'acc-foreign',  trigger: '있음' },
    jaundice:     { acc: 'acc-jaundice', trigger: '있음' },
    new_drug:     { acc: 'acc-drug',     trigger: '있음' },
  };
  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;
      const rule = ACCORDION_RULES[group];
      if (rule) VF.toggleAccordion(document.getElementById(rule.acc), this.dataset.value === rule.trigger);
      if (group === 'vomiting' && this.dataset.value === '있음') VF.Router.addBranchIfMissing('vomiting');
      if (group === 'diarrhea' && this.dataset.value === '있음') VF.Router.addBranchIfMissing('diarrhea');
      if (group === 'oral'     && this.dataset.value === '있음') VF.Router.addBranchIfMissing('dental');
      if (group === 'jaundice' && this.dataset.value === '있음') {
        VF.showUrgentAlert(document.getElementById('urgent-jaundice'), '황달은 간담도 질환의 위험 신호입니다. 빠른 내원을 권장합니다.');
      }
    });
  });
  function handleNext() {
    VF.Storage.set('branch_anorexia', {
      since: state.since, degree: state.degree, pattern: state.pattern,
      treats_ok: state.treats_ok, food_behavior: state.food_behavior,
      water: state.water, diet_change: state.diet_change,
      diet_detail: document.getElementById('f-diet-detail').value.trim(),
      vomiting: state.vomiting, diarrhea: state.diarrhea,
      energy: state.energy, weight: state.weight, oral: state.oral, abdomen: state.abdomen,
      foreign_body: state.foreign_body,
      foreign_detail: document.getElementById('f-foreign-detail').value.trim(),
      jaundice: state.jaundice, new_drug: state.new_drug,
      drug_detail: document.getElementById('f-drug-detail').value.trim(),
      notes: document.getElementById('f-notes').value.trim(),
    });
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
