<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 발작</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header"><div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div></header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>
<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 13</div>
    <div class="vf-page-title__h1">🧠 발작</div>
    <div class="vf-page-title__desc">발작에 대해 조금 더 알려주세요.</div>
  </div>
  <div class="vf-emergency-banner vf-mt-md">
    <span style="font-size:20px">⚠️</span>
    <span class="vf-emergency-banner__text">발작이 멈추지 않거나 5분 이상 계속되면 지금 바로 내원해주세요.</span>
  </div>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">언제 발생했나요?</label><div class="vf-chips"><button class="vf-chip" data-group="when" data-value="지금 막 끝남">지금 막 끝남</button> <button class="vf-chip" data-group="when" data-value="오늘">오늘</button> <button class="vf-chip" data-group="when" data-value="2~3일 내">2~3일 내</button> <button class="vf-chip" data-group="when" data-value="1주일 이상 전">1주일 이상 전</button></div></div><div class="vf-field"><label class="vf-label">발작 횟수</label><div class="vf-chips"><button class="vf-chip" data-group="count" data-value="처음">처음</button> <button class="vf-chip" data-group="count" data-value="2~3회">2~3회</button> <button class="vf-chip" data-group="count" data-value="자주 반복됨">자주 반복됨</button></div></div><div class="vf-field"><label class="vf-label">발작 지속 시간</label><div class="vf-chips"><button class="vf-chip" data-group="duration" data-value="1분 이내">1분 이내</button> <button class="vf-chip" data-group="duration" data-value="1~5분">1~5분</button> <button class="vf-chip" data-group="duration" data-value="5분 이상">5분 이상</button> <button class="vf-chip" data-group="duration" data-value="모름">모름</button></div><div class="vf-accordion" id="acc-duration"><div class="vf-accordion__inner"><div id="urgent-duration"></div></div></div></div><div class="vf-field"><label class="vf-label">하루에 몇 번 발생했나요?</label><div class="vf-chips"><button class="vf-chip" data-group="daily_count" data-value="1번">1번</button> <button class="vf-chip" data-group="daily_count" data-value="2~3번">2~3번</button> <button class="vf-chip" data-group="daily_count" data-value="4번 이상">4번 이상</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🧠</span><span class="vf-section__title">발작 양상 세부</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">발작할 때 어떤 모습이었나요? (여러 개 선택 가능)</label><div class="vf-chips"><button class="vf-chip" data-multi="seizure_type" data-value="온몸이 뻣뻣하게 굳음">온몸이 뻣뻣하게 굳음</button> <button class="vf-chip" data-multi="seizure_type" data-value="온몸을 떰">온몸을 떰</button> <button class="vf-chip" data-multi="seizure_type" data-value="다리를 허공에 젓는 동작">다리를 허공에 젓는 동작</button> <button class="vf-chip" data-multi="seizure_type" data-value="한쪽만 떨거나 움직임">한쪽만 떨거나 움직임</button> <button class="vf-chip" data-multi="seizure_type" data-value="멍하게 있음">멍하게 있음</button> <button class="vf-chip" data-multi="seizure_type" data-value="씹는 동작 반복">씹는 동작 반복</button> <button class="vf-chip" data-multi="seizure_type" data-value="쓰러짐">쓰러짐</button></div></div><div class="vf-field"><label class="vf-label">발작 전 이상한 행동이 있었나요?</label><div class="vf-chips"><button class="vf-chip" data-group="aura" data-value="없음">없음</button> <button class="vf-chip" data-group="aura" data-value="있음 (불안해 보임, 멍함, 침 흘림 등)">있음 (불안해 보임, 멍함, 침 흘림 등)</button> <button class="vf-chip" data-group="aura" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">발작 중 의식이 있었나요?</label><div class="vf-chips"><button class="vf-chip" data-group="consciousness" data-value="없었던 것 같음">없었던 것 같음</button> <button class="vf-chip" data-group="consciousness" data-value="있었던 것 같음">있었던 것 같음</button> <button class="vf-chip" data-group="consciousness" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">발작 후 어떤 모습이었나요? (여러 개 선택 가능)</label><div class="vf-chips"><button class="vf-chip" data-multi="postictal" data-value="금방 회복됨">금방 회복됨</button> <button class="vf-chip" data-multi="postictal" data-value="한동안 멍함">한동안 멍함</button> <button class="vf-chip" data-multi="postictal" data-value="비틀거림">비틀거림</button> <button class="vf-chip" data-multi="postictal" data-value="일시적으로 시력 잃은 것 같음">일시적으로 시력 잃은 것 같음</button> <button class="vf-chip" data-multi="postictal" data-value="많이 피로해 보임">많이 피로해 보임</button></div></div><div class="vf-field"><label class="vf-label">주로 언제 발생하나요?</label><div class="vf-chips"><button class="vf-chip" data-group="timing" data-value="자다가">자다가</button> <button class="vf-chip" data-group="timing" data-value="흥분했을 때">흥분했을 때</button> <button class="vf-chip" data-group="timing" data-value="먹고 나서">먹고 나서</button> <button class="vf-chip" data-group="timing" data-value="특별한 때 없음">특별한 때 없음</button> <button class="vf-chip" data-group="timing" data-value="모름">모름</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">발작 중 대소변을 지렸나요?</label><div class="vf-chips"><button class="vf-chip" data-group="incontinence" data-value="없음">없음</button> <button class="vf-chip" data-group="incontinence" data-value="있음">있음</button> <button class="vf-chip" data-group="incontinence" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">발작 후 기력·식욕</label><div class="vf-chips"><button class="vf-chip" data-group="post_condition" data-value="금방 정상">금방 정상</button> <button class="vf-chip" data-group="post_condition" data-value="한동안 처짐">한동안 처짐</button> <button class="vf-chip" data-group="post_condition" data-value="아직 처져있음">아직 처져있음</button></div></div><div class="vf-field"><label class="vf-label">비틀거리거나 균형을 못 잡나요?</label><div class="vf-chips"><button class="vf-chip" data-group="ataxia" data-value="없음">없음</button> <button class="vf-chip" data-group="ataxia" data-value="있음">있음</button></div></div><div class="vf-field"><label class="vf-label">시력이 없는 것 같나요?</label><div class="vf-chips"><button class="vf-chip" data-group="blindness" data-value="없음">없음</button> <button class="vf-chip" data-group="blindness" data-value="있는 것 같음">있는 것 같음</button></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body"><div class="vf-field"><label class="vf-label">발작이 멈추지 않고 계속되고 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="ongoing" data-value="멈췄음">멈췄음</button> <button class="vf-chip" data-group="ongoing" data-value="아직 계속되는 것 같음">아직 계속되는 것 같음</button></div><div class="vf-accordion" id="acc-ongoing"><div class="vf-accordion__inner"><div id="urgent-ongoing"></div></div></div></div><div class="vf-field"><label class="vf-label">최근 독성물질·약물 노출 가능성</label><div class="vf-chips"><button class="vf-chip" data-group="toxin" data-value="없음">없음</button> <button class="vf-chip" data-group="toxin" data-value="있음">있음</button> <button class="vf-chip" data-group="toxin" data-value="모름">모름</button></div><div class="vf-accordion" id="acc-toxin"><div class="vf-accordion__inner"><input class="vf-input" type="text" id="f-toxin-detail" placeholder="어떤 물질인가요?" /></div></div></div><div class="vf-field"><label class="vf-label">최근 외상 가능성</label><div class="vf-chips"><button class="vf-chip" data-group="trauma" data-value="없음">없음</button> <button class="vf-chip" data-group="trauma" data-value="있음">있음</button> <button class="vf-chip" data-group="trauma" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">이전에 발작으로 진단·치료받은 적 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="seizure_hx" data-value="없음">없음</button> <button class="vf-chip" data-group="seizure_hx" data-value="있음">있음</button> <button class="vf-chip" data-group="seizure_hx" data-value="모름">모름</button></div><div class="vf-accordion" id="acc-seizure-hx"><div class="vf-accordion__inner"><div class="vf-chips"><button class="vf-chip" data-group="antiepileptic" data-value="현재 항경련제 복용 중">현재 항경련제 복용 중</button> <button class="vf-chip" data-group="antiepileptic" data-value="복용 안 함">복용 안 함</button></div></div></div></div><div class="vf-field"><label class="vf-label">혈당 관련 질환(당뇨) 진단받은 적 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="diabetes_hx" data-value="없음">없음</button> <button class="vf-chip" data-group="diabetes_hx" data-value="있음">있음</button> <button class="vf-chip" data-group="diabetes_hx" data-value="모름">모름</button></div></div><div class="vf-field"><label class="vf-label">미중성화 암컷인데 최근 출산한 적 있나요?</label><div class="vf-chips"><button class="vf-chip" data-group="eclampsia_risk" data-value="해당 없음">해당 없음</button> <button class="vf-chip" data-group="eclampsia_risk" data-value="없음">없음</button> <button class="vf-chip" data-group="eclampsia_risk" data-value="있음 (1개월 이내)">있음 (1개월 이내)</button> <button class="vf-chip" data-group="eclampsia_risk" data-value="있음 (1~3개월)">있음 (1~3개월)</button></div><div class="vf-accordion" id="acc-eclampsia"><div class="vf-accordion__inner"><div id="urgent-eclampsia"></div></div></div></div></div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="발작에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>
<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>
<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const multiState = {};
  const ACCORDION_RULES = {};

  Object.assign(ACCORDION_RULES, {
    toxin:      { acc: 'acc-toxin',      trigger: '있음' },
    seizure_hx: { acc: 'acc-seizure-hx', trigger: '있음' },
  });
  function collectTextFields(data) {
    data.toxin_detail = document.getElementById('f-toxin-detail') ? document.getElementById('f-toxin-detail').value.trim() : '';
  }
  function handleSideEffect(group, value) {
    if (group === 'ataxia' && value === '있음') VF.Router.addBranchIfMissing('syncope');
    if (group === 'duration' && value === '5분 이상') {
      VF.toggleAccordion(document.getElementById('acc-duration'), true);
      VF.showUrgentAlert(document.getElementById('urgent-duration'), '발작이 5분 이상 지속되는 것은 응급입니다. 즉시 내원해주세요.');
    }
    if (group === 'ongoing' && value === '아직 계속되는 것 같음') {
      VF.toggleAccordion(document.getElementById('acc-ongoing'), true);
      VF.showUrgentAlert(document.getElementById('urgent-ongoing'), '발작이 멈추지 않고 있습니다. 지금 바로 내원해주세요.');
    }
    if (group === 'eclampsia_risk' && value === '있음 (1개월 이내)') {
      VF.toggleAccordion(document.getElementById('acc-eclampsia'), true);
      VF.showUrgentAlert(document.getElementById('urgent-eclampsia'), '수유 중 발작은 유열(eclampsia) 응급일 수 있습니다. 즉시 내원해주세요.');
    }
  }

  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;
      const rule = ACCORDION_RULES[group];
      if (rule) VF.toggleAccordion(document.getElementById(rule.acc), this.dataset.value === rule.trigger);
      handleSideEffect(group, this.dataset.value);
    });
  });
  document.querySelectorAll('.vf-chip[data-multi]').forEach(chip => {
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      const key = this.dataset.multi;
      const val = this.dataset.value;
      if (!multiState[key]) multiState[key] = [];
      if (this.classList.contains('selected')) { if (!multiState[key].includes(val)) multiState[key].push(val); }
      else { multiState[key] = multiState[key].filter(v => v !== val); }
    });
  });
  function handleNext() {
    const data = Object.assign({}, state);
    Object.keys(multiState).forEach(k => { data[k] = multiState[k]; });
    data.notes = document.getElementById('f-notes').value.trim();
    collectTextFields(data);
    VF.Storage.set('branch_seizure', data);
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
