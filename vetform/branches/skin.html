<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VetForm — 피부 이상</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<header class="vf-header"><div><div class="vf-header__logo">🐾 VetForm</div><div class="vf-header__subtitle">증상 상세 문진</div></div></header>
<div class="vf-progress"><div class="vf-progress__bar" id="progressBar" style="width:0%"></div></div>
<div class="vf-page">
  <div class="vf-page-title vf-mt-md">
    <div class="vf-page-title__label">Branch 9</div>
    <div class="vf-page-title__h1">🔴 피부 이상</div>
    <div class="vf-page-title__desc">피부 이상에 대해 조금 더 알려주세요.</div>
  </div>

  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🕐</span><span class="vf-section__title">발생 양상</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">언제부터인가요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="since" data-value="오늘">오늘</button>
          <button class="vf-chip" data-group="since" data-value="2~3일">2~3일</button>
          <button class="vf-chip" data-group="since" data-value="1주일">1주일</button>
          <button class="vf-chip" data-group="since" data-value="1달 이상">1달 이상</button>
          <button class="vf-chip" data-group="since" data-value="오래됨(수개월)">오래됨(수개월)</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">패턴</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="pattern" data-value="계속">계속</button>
          <button class="vf-chip" data-group="pattern" data-value="좋아졌다 나빠졌다 반복">좋아졌다 나빠졌다 반복</button>
          <button class="vf-chip" data-group="pattern" data-value="점점 심해짐">점점 심해짐</button>
          <button class="vf-chip" data-group="pattern" data-value="계절마다 반복">계절마다 반복</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">처음 발생 나이</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="onset_age" data-value="어릴 때부터">어릴 때부터</button>
          <button class="vf-chip" data-group="onset_age" data-value="성견·성묘 되고 나서">성견·성묘 되고 나서</button>
          <button class="vf-chip" data-group="onset_age" data-value="모름">모름</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔍</span><span class="vf-section__title">병변 양상 세부</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">어디에 생겼나요? (여러 개 선택 가능)</label>
              <div class="vf-chips">
          <button class="vf-chip" data-multi="location" data-value="얼굴·입 주변">얼굴·입 주변</button>
          <button class="vf-chip" data-multi="location" data-value="귀">귀</button>
          <button class="vf-chip" data-multi="location" data-value="겨드랑이·사타구니">겨드랑이·사타구니</button>
          <button class="vf-chip" data-multi="location" data-value="발·발가락 사이">발·발가락 사이</button>
          <button class="vf-chip" data-multi="location" data-value="배">배</button>
          <button class="vf-chip" data-multi="location" data-value="등·꼬리">등·꼬리</button>
          <button class="vf-chip" data-multi="location" data-value="전신">전신</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">어떻게 생겼나요? (여러 개 선택 가능)</label>
              <div class="vf-chips">
          <button class="vf-chip" data-multi="lesion_type" data-value="빨개짐">빨개짐</button>
          <button class="vf-chip" data-multi="lesion_type" data-value="털 빠짐">털 빠짐</button>
          <button class="vf-chip" data-multi="lesion_type" data-value="딱지">딱지</button>
          <button class="vf-chip" data-multi="lesion_type" data-value="진물">진물</button>
          <button class="vf-chip" data-multi="lesion_type" data-value="뾰루지·농포">뾰루지·농포</button>
          <button class="vf-chip" data-multi="lesion_type" data-value="비듬·각질">비듬·각질</button>
          <button class="vf-chip" data-multi="lesion_type" data-value="덩어리·혹">덩어리·혹</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">가려워하나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="pruritus" data-value="없음">없음</button>
          <button class="vf-chip" data-group="pruritus" data-value="약간">약간</button>
          <button class="vf-chip" data-group="pruritus" data-value="심하게 (계속 긁거나 핥음)">심하게 (계속 긁거나 핥음)</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">냄새가 나나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="odor" data-value="없음">없음</button>
          <button class="vf-chip" data-group="odor" data-value="약간">약간</button>
          <button class="vf-chip" data-group="odor" data-value="심하게">심하게</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">🔗</span><span class="vf-section__title">동반 증상 및 유발 요인</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">발을 자주 핥거나 씹나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="paw_licking" data-value="없음">없음</button>
          <button class="vf-chip" data-group="paw_licking" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">눈·코 분비물 동반</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="eye_nose_discharge" data-value="없음">없음</button>
          <button class="vf-chip" data-group="eye_nose_discharge" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">귀 이상 동반</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="ear_problem" data-value="없음">없음</button>
          <button class="vf-chip" data-group="ear_problem" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 새로운 음식·간식 먹었나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="new_food" data-value="없음">없음</button>
          <button class="vf-chip" data-group="new_food" data-value="있음">있음</button>
        </div>
        <div class="vf-accordion" id="acc-food">
          <div class="vf-accordion__inner"><input class="vf-input" type="text" id="f-food-detail" placeholder="어떤 음식인가요?" /></div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">최근 새로운 샴푸·용품 사용했나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="new_product" data-value="없음">없음</button>
          <button class="vf-chip" data-group="new_product" data-value="있음">있음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">동거 동물 동일 증상</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="housemate_sick" data-value="없음">없음</button>
          <button class="vf-chip" data-group="housemate_sick" data-value="있음">있음</button>
          <button class="vf-chip" data-group="housemate_sick" data-value="동거동물 없음">동거동물 없음</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">⚠️</span><span class="vf-section__title">위험 신호</span></div>
    <div class="vf-section__body">
      <div class="vf-field">
        <label class="vf-label">덩어리나 혹이 있나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="mass" data-value="없음">없음</button>
          <button class="vf-chip" data-group="mass" data-value="있음">있음</button>
        </div>
        <div class="vf-accordion" id="acc-mass">
          <div class="vf-accordion__inner"><input class="vf-input" type="text" id="f-mass-detail" placeholder="크기가 어느 정도인가요? 언제부터 생겼나요?" /></div>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">빠르게 퍼지거나 갑자기 심해졌나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="rapid_spread" data-value="아니요">아니요</button>
          <button class="vf-chip" data-group="rapid_spread" data-value="그런 것 같음">그런 것 같음</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">이전에 피부병으로 진단·치료받은 적 있나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="skin_hx" data-value="없음">없음</button>
          <button class="vf-chip" data-group="skin_hx" data-value="있음">있음</button>
          <button class="vf-chip" data-group="skin_hx" data-value="모름">모름</button>
        </div>
      </div>
      <div class="vf-field">
        <label class="vf-label">외부기생충 예방을 최근에 했나요?</label>
              <div class="vf-chips">
          <button class="vf-chip" data-group="parasite_prevention" data-value="하고 있음">하고 있음</button>
          <button class="vf-chip" data-group="parasite_prevention" data-value="최근 안 함">최근 안 함</button>
          <button class="vf-chip" data-group="parasite_prevention" data-value="안 함">안 함</button>
        </div>
      </div>
    </div>
  </section>
  <section class="vf-section vf-mt-md">
    <div class="vf-section__header"><span class="vf-section__icon">💬</span><span class="vf-section__title">추가 전달 사항</span><span class="vf-section__badge vf-section__badge--optional">선택</span></div>
    <div class="vf-section__body">
      <textarea class="vf-textarea" id="f-notes" placeholder="피부 이상에 대해 추가로 전달하고 싶은 내용을 적어주세요" rows="3"></textarea>
    </div>
  </section>
</div>
<div class="vf-bottom-bar">
  <button class="vf-btn vf-btn--secondary" onclick="history.back()">← 이전</button>
  <button class="vf-btn vf-btn--primary" onclick="handleNext()">다음 →</button>
</div>
<script src="../assets/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const state = {};
  const multiState = {};
  const ACCORDION_RULES = {};

  Object.assign(ACCORDION_RULES, {
    new_food: { acc: 'acc-food', trigger: '있음' },
    mass:     { acc: 'acc-mass', trigger: '있음' },
  });
  function collectTextFields(data) {
    data.food_detail = document.getElementById('f-food-detail') ? document.getElementById('f-food-detail').value.trim() : '';
    data.mass_detail = document.getElementById('f-mass-detail') ? document.getElementById('f-mass-detail').value.trim() : '';
  }
  function handleSideEffect(group, value) {
    if (group === 'ear_problem' && value === '있음') VF.Router.addBranchIfMissing('ear');
  }

  document.querySelectorAll('.vf-chip[data-group]').forEach(chip => {
    chip.addEventListener('click', function() {
      const group = this.dataset.group;
      document.querySelectorAll(`.vf-chip[data-group="${group}"]`).forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      state[group] = this.dataset.value;
      const rule = ACCORDION_RULES[group];
      if (rule) VF.toggleAccordion(document.getElementById(rule.acc), this.dataset.value === rule.trigger);
      handleSideEffect(group, this.dataset.value);
    });
  });
  document.querySelectorAll('.vf-chip[data-multi]').forEach(chip => {
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      const key = this.dataset.multi;
      const val = this.dataset.value;
      if (!multiState[key]) multiState[key] = [];
      if (this.classList.contains('selected')) { if (!multiState[key].includes(val)) multiState[key].push(val); }
      else { multiState[key] = multiState[key].filter(v => v !== val); }
    });
  });
  function handleNext() {
    const data = Object.assign({}, state);
    Object.keys(multiState).forEach(k => { data[k] = multiState[k]; });
    data.notes = document.getElementById('f-notes').value.trim();
    collectTextFields(data);
    VF.Storage.set('branch_skin', data);
    VF.Router.completeCurrent();
  }
  window.handleNext = handleNext;
  VF.updateProgressBar(Math.round(VF.Router.getProgress() * 100));
});
</script>
</body>
</html>
